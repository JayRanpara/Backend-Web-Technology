<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>

<body>
   <script>
      let range1 = parseInt(prompt("Enter first number"));
      let range2 = parseInt(prompt("Enter second number"));
      let arr = [];
      for (let i = range1+1; i < range2; i++) {
         let count = 0;
         for (let j = 2; j < i; j++) {
            if (i % j == 0) {
               count++;
            }
         }
         if (count == 0) {
            arr.push(i);
         } 
      }
      console.log(arr);
   </script>
</body>

</html>
