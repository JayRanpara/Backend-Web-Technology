<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
   <script>
      let num = parseInt(prompt("Enter Number Between 0-999"));
      if(num<0||num>999) {
         alert("invalid input ");
      }
      else {
         const ones = ["","one","two","three","four","five","six","seven","eight","nine"];
         const teens = ["ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen","seventeen","eighteen","nineteen"];
         const tens = ["","","twenty","thirty","forty","fifty","sixty","seventy","eighty","ninety"];

         let words = "";
         if(num>100) {
            let hundredNum = Math.floor(num/100);
            words+=ones[hundredNum]+" hundred ";
            num = num%100;
         }
         if(num>=20) {
            let tensNum = Math.floor(num/10);
            words+=tens[tensNum]+" ";
            num = num%10;
         }
         else if(num>=10) {
            words+=teens[num-10]; 
            num = 0
         }
         words+=ones[num];
         console.log(words);
      }
      
   </script>
</body>
</html>
