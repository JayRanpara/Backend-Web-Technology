<body>
   <script>
      let input = parseInt(prompt("Enter terms "));
      input = input-2;
      let arr = [];
      let a = 0;
      let b = 1
      arr.push(a);
      arr.push(b);
      for(let i = 0; i<input ; i++) {
         let c = a+b;
         arr.push(c);
         a = b;
         b = c;
      }
      console.log(arr);
   </script>
</body>
