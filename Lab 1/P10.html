<body>
   <script>
      function gcd(a,b) {
         while(b!=0) {
            let temp = a%b;
            a = b;
            b = temp;
         }
         return a;
      }
      let a = parseInt(prompt("Enter First Number"));
      let b = parseInt(prompt("Enter Second Number"));
      console.log(gcd(a,b));
   </script>
</body>
