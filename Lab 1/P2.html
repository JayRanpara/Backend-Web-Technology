<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
   <script>
      let input = parseInt(prompt("Enter Number"));
      let count = 0;
      for(let i = 2; i<input; i++) {
         if(input%i == 0) {
            count++;
         }
      }
      if(count == 0) {
         console.log("Prime Number");
      } else {
         console.log("not Prime");
      }
   </script>
</body>
</html>
