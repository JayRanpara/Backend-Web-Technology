<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
   <script>
      let input = parseInt(prompt("Enter Number"));

      if(input>10&&input<99) {
         let firstDigit = Math.floor(input/10);
         let secondDigit = input%10;

         console.log(`${firstDigit}^${secondDigit} = ${Math.pow(firstDigit,secondDigit)}`);
      } else {
         alert("Invalid input please enter two Digit Number");
      }
   </script>
</body>
</html>
