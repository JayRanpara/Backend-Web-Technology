<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
</head>
<body>
   <script>
      let input = parseInt(prompt("Enter first number"));
      let input2 = parseInt(prompt("Enter first number"));
      let sign = prompt("enter sign");

      let ans = 0;
      if(sign == '+') {
         ans = input+input2;
      } else if(sign == '-') {
         ans = input - input2;
      } else if(sign == '*') {
         ans = input*input2;
      } else if(sign == '/'){
         ans = input/input2;
      }
      console.log(ans);
   </script>
</body>
</html>
